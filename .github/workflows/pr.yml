name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (warnings as errors)
        run: cargo clippy -- -D warnings

      - name: Install tmux (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tmux fzf

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux fzf

      # Tests share the default tmux server. With no session it exits as soon as
      # the last test session is killed, racing other tests' new-session calls.
      - name: Keep a tmux server running
        run: tmux new-session -d -s ci-anchor

      - name: Run tests
        run: cargo test
        env:
          TERM: xterm-256color

      - name: Build release binary
        run: cargo build --release
